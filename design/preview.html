<title>Learning Progress Kit</title>
<meta name="color-scheme" content="light">
<!-- Font dimuat lewat <link>, bukan @import: @import di dalam <style> menunda
     pemuatan sampai CSS selesai diurai dan sering gagal senyap di lingkungan
     ber-CSP ketat. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
  html,body{margin:0;background:#EFE7F2}
  body{font-family:Poppins,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,b,strong,.tabular-nums{font-family:"Baloo 2",Poppins,system-ui,sans-serif}
  .tabular-nums{font-variant-numeric:tabular-nums}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  /* Scrubber player. */
  input[type=range]{--p:0%}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;
    background:linear-gradient(90deg,#1E5A4E var(--p),rgba(23,36,31,.14) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:#1E5A4E;border:3px solid #FBF3E1;margin-top:-6px;box-shadow:0 2px 8px rgba(23,36,31,.35)}
  input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:rgba(23,36,31,.14)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#1E5A4E;border:3px solid #FBF3E1}
  input[type=range]:focus-visible{outline:3px solid #B32F49;outline-offset:4px}
  *:focus-visible{outline:3px solid #B32F49;outline-offset:2px}
  ::-webkit-scrollbar{width:0;height:0}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script>
  // Framer Motion dan React dipaparkan sebagai global supaya kode sumber yang
  // aslinya memakai import bisa dijalankan apa adanya setelah baris import
  // dibuang oleh build-preview.js.
  window.useState = React.useState; window.useEffect = React.useEffect;
  window.useRef = React.useRef; window.useMemo = React.useMemo;
  window.motion = Motion.motion; window.AnimatePresence = Motion.AnimatePresence;
</script>

<script type="text/babel" data-presets="react">
/* ======================== theme.js ======================== */
/**
 * Design tokens.
 *
 * Semua warna, radius, dan spesifikasi motion tinggal di sini supaya layar
 * tidak pernah meng-hardcode nilai. Menambah layar baru berarti menambah satu
 * entri "mode kognitif" di bawah, bukan memilih warna secara ad hoc.
 */

/* ---------------------------------------------------------------- Warna --- */

const colors = {
  /* Coral — mode aktif belajar.
   *
   * Nilai di brief (#EE6B7A → #E4536A) hanya mencapai 2.94:1 dan 3.60:1 dengan
   * teks putih, jadi gagal WCAG AA untuk teks normal yang butuh 4.5:1. Karena
   * checklist meminta kontras lolos, hue-nya dipertahankan tapi diperdalam
   * sampai 4.59:1 dan 6.04:1. Nilai asli tetap disimpan di bawah untuk
   * pemakaian dekoratif yang tidak membawa teks. */
  coralFrom: "#CD4159",
  coralTo: "#B32F49",
  coralDecor: "#EE6B7A",
  coralSoft: "#F2A6B0",

  /* Cream — mode analisis dan perencanaan. */
  cream: "#FBF3E1",
  creamDeep: "#F3E8CE",

  /* Teal — mode status dan kompetisi. */
  tealDeep: "#1E5A4E",
  tealDark: "#164439",
  tealSoft: "#8CCBB8",

  orangeAccent: "#F4A73B",
  pinkAccent: "#F2A6B0",

  textDark: "#17241F",
  textMuted: "#5C6B63",
  textWhite: "#FFFDF8",
  /* Teks sekunder di atas coral.
     Tint merah muda (#F7DCE0) hanya mencapai 3.62:1 dan gagal AA, jadi
     hierarki di atas coral dibentuk lewat berat dan ukuran huruf, bukan lewat
     penurunan opasitas warna. */
  textOnCoralMuted: "#FFFDF8",
  textOnTealMuted: "#B9D6CC",

  chartLine: "#E4536A",
  chartFill: "#E4536A",

  white: "#FFFFFF",
  hairline: "rgba(23,36,31,.10)",
  translucent: "rgba(255,255,255,.16)",
};

/**
 * Mode kognitif per layar. Aturannya: tentukan mode dulu, warna mengikuti.
 * Layar baru wajib mendaftar di sini sebelum memilih warna apa pun.
 */
const cognitiveModes = {
  learning: { label: "Mode belajar aktif", surface: "coral", onSurface: colors.textWhite },
  planning: { label: "Mode analisis", surface: "cream", onSurface: colors.textDark },
  status: { label: "Mode status & kompetisi", surface: "teal", onSurface: colors.textWhite },
};

/* -------------------------------------------------------- Bentuk & ruang --- */

const radius = { panel: 34, sheet: 32, card: 16, chip: 14, pill: 999 };

/** Skala 8pt. */
const space = { xs: 8, sm: 16, md: 24, lg: 32, xl: 40 };

const layout = {
  frameWidth: 390,
  paddingX: 26,
  /** Seberapa jauh panel konten menindih header. Pola tetap di semua layar. */
  sheetOverlap: 34,
};

const shadow = {
  /* Kedalaman dibentuk lewat color-blocking dan overlap, bukan drop-shadow
     tebal. Shadow di sini sengaja lembut dan jarang dipakai. */
  soft: "0 18px 40px -24px rgba(23,36,31,.45)",
  lifted: "0 22px 45px -20px rgba(23,36,31,.55)",
};

const typography = {
  display: '"Baloo 2", Poppins, ui-rounded, system-ui, sans-serif',
  body: 'Poppins, Inter, system-ui, sans-serif',
  sizes: { metric: 46, headline: 23, title: 17, body: 14, caption: 11.5 },
};

/* ------------------------------------------------------------- Motion ---- */

/** easeOutQuint — dipakai untuk semua entrance. */
const easeOutQuint = [0.22, 1, 0.36, 1];

const motionSpec = {
  /** Entrance berjenjang: header → stat row → hero/chart. */
  stagger: { delayStep: 0.07, duration: 0.36 },
  fadeUp: {
    hidden: { opacity: 0, y: 18 },
    show: (i = 0) => ({
      opacity: 1,
      y: 0,
      transition: { duration: 0.36, delay: i * 0.07, ease: easeOutQuint },
    }),
  },
  /** Transisi antar layar: cross-fade + scale tipis. */
  screen: {
    initial: { opacity: 0, scale: 0.98 },
    animate: { opacity: 1, scale: 1 },
    exit: { opacity: 0, scale: 0.98 },
    transition: { type: "spring", stiffness: 260, damping: 24 },
  },
  /** Progress ring: stroke-dashoffset dari kosong ke nilai target. */
  ring: { duration: 0.95, ease: "easeInOut" },
  /** Line chart: path digambar progresif. */
  chartDraw: { duration: 0.9, ease: "easeInOut" },
  /** Tooltip puncak muncul setelah garis selesai. */
  tooltipPop: { type: "spring", stiffness: 420, damping: 14, delay: 0.95 },
  /** Angka besar menghitung naik, sinkron dengan ring/chart. */
  countUp: { duration: 950 },
  /** Pil putih segmented control berpindah, bukan bertukar seketika. */
  segment: { type: "spring", stiffness: 380, damping: 32 },
  /** Baris leaderboard masuk berjenjang. */
  rowStagger: 0.05,
  /** Tekan tombol. */
  press: { scale: 0.96, transition: { duration: 0.11 } },
  /** Badge dekoratif mengambang halus, terus-menerus. */
  float: {
    animate: { y: [0, -3, 0] },
    transition: { duration: 3, repeat: Infinity, ease: "easeInOut" },
  },
  toggle: { type: "spring", stiffness: 500, damping: 34 },
};

const theme = { colors, cognitiveModes, radius, space, layout, shadow, typography, motionSpec, easeOutQuint };

/* ======================== primitives.jsx ======================== */
/**
 * Ikon Lucide.
 *
 * Di proyek dengan bundler, ganti isi berkas ini dengan
 * `export { Play, Pause, Star } from "lucide-react"` dan pakai langsung.
 * Versi ini membaca data node Lucide dari global UMD supaya prototipe bisa
 * jalan tanpa build step — ikonnya tetap Lucide yang sama, satu library.
 */
function Icon({ name, size = 20, strokeWidth = 1.75, className = "", style }) {
  const node = (typeof window !== "undefined" && window.lucide?.icons?.[name]) || null;
  if (!node) return null;
  const [, attrs, children = []] = node;
  return (
    <svg
      {...attrs}
      width={size}
      height={size}
      strokeWidth={strokeWidth}
      className={className}
      style={style}
      aria-hidden="true"
      focusable="false"
    >
      {children.map(([tag, props], i) => React.createElement(tag, { ...props, key: i }))}
    </svg>
  );
}

/** Tombol ikon. Wajib punya label karena tidak membawa teks. */
function IconButton({ label, name, onClick, size = 44, iconSize = 20, className = "", style }) {
  return (
    <motion.button
      type="button"
      aria-label={label}
      onClick={onClick}
      whileTap={motionSpec.press}
      className={`grid place-items-center rounded-full ${className}`}
      style={{ width: size, height: size, ...style }}
    >
      <Icon name={name} size={iconSize} />
    </motion.button>
  );
}

/**
 * Tautan detail.
 *
 * Progressive disclosure: kartu ringkasan hanya memuat angka utama, dan setiap
 * detail lanjutan disembunyikan di balik tautan ini. Posisinya selalu di
 * kanan-atas section — jangan pernah dipindah ke tengah atau bawah.
 */
function LearnMore({ onClick, tone = "dark", label = "Learn More" }) {
  const gelap = tone === "dark";
  return (
    <motion.button
      type="button"
      onClick={onClick}
      whileTap={motionSpec.press}
      aria-label={`${label} — buka detail`}
      className="flex items-center gap-2 shrink-0"
      style={{ color: gelap ? colors.textDark : colors.textWhite }}
    >
      <span className="text-[12px] font-semibold">{label}</span>
      <span
        className="grid place-items-center rounded-full"
        style={{
          width: 34,
          height: 34,
          background: gelap ? colors.white : colors.translucent,
          boxShadow: gelap ? shadow.soft : "none",
        }}
      >
        <Icon name="ArrowUpRight" size={16} />
      </span>
    </motion.button>
  );
}

/** Kepala section: judul di kiri, Learn More terkunci di kanan-atas. */
function SectionHead({ children, onLearnMore, tone = "dark" }) {
  return (
    <div className="flex items-start justify-between gap-3">
      <div className="min-w-0">{children}</div>
      {onLearnMore && <LearnMore onClick={onLearnMore} tone={tone} />}
    </div>
  );
}

/**
 * Panel konten yang menindih header — pola tetap "docked bottom-sheet".
 * Dipakai di ketiga layar tanpa kecuali.
 */
function DockedSheet({ children, background = colors.cream, className = "", style }) {
  return (
    <motion.section
      variants={motionSpec.fadeUp}
      custom={1}
      className={`relative z-10 flex-1 ${className}`}
      style={{
        background,
        marginTop: -layout.sheetOverlap,
        borderTopLeftRadius: radius.sheet,
        borderTopRightRadius: radius.sheet,
        padding: `26px ${layout.paddingX}px 20px`,
        ...style,
      }}
    >
      {children}
    </motion.section>
  );
}

/** Kepala salam. Dipakai di layar A dan B dengan warna berbeda. */
function GreetingHeader({ name, date, tone = "light", onToggle, toggleOn, avatarBg }) {
  const terang = tone === "light";
  const warnaUtama = terang ? colors.textWhite : colors.textDark;
  const warnaSekunder = terang ? colors.textOnCoralMuted : colors.textMuted;
  return (
    <motion.header variants={motionSpec.fadeUp} custom={0} className="flex items-start justify-between gap-3">
      <div className="flex items-center gap-3 min-w-0">
        <div
          className="grid place-items-center rounded-full shrink-0"
          style={{ width: 40, height: 40, background: avatarBg || colors.translucent, color: warnaUtama }}
        >
          <Icon name="Sparkles" size={18} />
        </div>
        <div className="min-w-0">
          <h1 className="font-extrabold leading-tight truncate" style={{ color: warnaUtama, fontSize: 17 }}>
            Hi, {name} <span aria-hidden="true">👋</span>
          </h1>
          {/* Hierarki lewat berat huruf, bukan warna pudar — supaya kontras tetap AA. */}
          <p style={{ color: warnaSekunder, fontSize: 12, fontWeight: 500, opacity: terang ? 0.92 : 1 }}>{date}</p>
        </div>
      </div>

      <div className="flex items-center gap-2 shrink-0">
        <div
          className="rounded-full grid place-items-center overflow-hidden"
          style={{ width: 42, height: 42, background: colors.pinkAccent, color: colors.textDark }}
          role="img"
          aria-label={`Foto profil ${name}`}
        >
          <Icon name="User" size={20} />
        </div>
        {onToggle && <ThemeToggle on={toggleOn} onChange={onToggle} tone={tone} />}
      </div>
    </motion.header>
  );
}

/** Switch dengan track yang ikut berubah warna, bukan cuma knop yang geser. */
function ThemeToggle({ on, onChange, tone = "light" }) {
  return (
    <motion.button
      type="button"
      role="switch"
      aria-checked={on}
      aria-label={on ? "Matikan notifikasi harian" : "Nyalakan notifikasi harian"}
      onClick={() => onChange(!on)}
      whileTap={motionSpec.press}
      className="relative rounded-full shrink-0"
      style={{ width: 46, height: 26, padding: 3 }}
      animate={{ backgroundColor: on ? colors.tealDeep : (tone === "light" ? "rgba(255,255,255,.3)" : colors.creamDeep) }}
      transition={{ duration: 0.2 }}
    >
      <motion.span
        layout
        transition={motionSpec.toggle}
        className="block rounded-full"
        style={{ width: 20, height: 20, background: colors.white, marginLeft: on ? 20 : 0 }}
      />
    </motion.button>
  );
}

/**
 * Angka yang menghitung naik dari nol.
 *
 * Memakai requestAnimationFrame, dan menghormati prefers-reduced-motion dengan
 * langsung menampilkan nilai akhir.
 */
function CountUp({ value, duration = motionSpec.countUp.duration, suffix = "", className = "", style }) {
  const [tampil, setTampil] = useState(0);
  const ref = useRef();

  useEffect(() => {
    const kurangiGerak = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
    if (kurangiGerak) { setTampil(value); return; }
    const mulai = performance.now();
    const langkah = (t) => {
      const p = Math.min(1, (t - mulai) / duration);
      // easeOutQuint, supaya berhenti selaras dengan ring dan chart.
      const e = 1 - Math.pow(1 - p, 5);
      setTampil(Math.round(value * e));
      if (p < 1) ref.current = requestAnimationFrame(langkah);
    };
    ref.current = requestAnimationFrame(langkah);
    return () => cancelAnimationFrame(ref.current);
  }, [value, duration]);

  return <span className={className} style={style}>{tampil}{suffix}</span>;
}

/** Format detik jadi mm:ss. */
const formatTime = (detik) => {
  const s = Math.max(0, Math.round(detik));
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
};

/* ======================== HomeScreen.jsx ======================== */
/* Mode kognitif: belajar aktif → permukaan coral. */

/**
 * Cincin progres.
 *
 * Entrance memakai durasi panjang ease-in-out sesuai spesifikasi motion —
 * itu yang menyampaikan "progres tercapai". Tapi durasi itu hanya boleh sekali:
 * player berdetak tiap detik, dan kalau setiap pembaruan memicu animasi 950ms
 * lagi, cincinnya akan selamanya tertinggal di belakang angka timer. Jadi
 * setelah mount, cincin mengikuti secara linear seirama detak.
 */
function ProgressRing({ progress, size = 188, stroke = 7 }) {
  const r = (size - stroke) / 2;
  const keliling = 2 * Math.PI * r;
  const sudahMasuk = React.useRef(false);

  React.useEffect(() => {
    const id = setTimeout(() => { sudahMasuk.current = true; }, motionSpec.ring.duration * 1000);
    return () => clearTimeout(id);
  }, []);

  return (
    <svg width={size} height={size} className="absolute inset-0 -rotate-90" aria-hidden="true">
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(23,36,31,.10)" strokeWidth={stroke} />
      <motion.circle
        cx={size / 2} cy={size / 2} r={r}
        fill="none" stroke={colors.orangeAccent} strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={keliling}
        initial={{ strokeDashoffset: keliling }}
        animate={{ strokeDashoffset: keliling * (1 - progress) }}
        transition={sudahMasuk.current ? { duration: 1, ease: "linear" } : motionSpec.ring}
      />
    </svg>
  );
}

/** Badge dekoratif yang mengambang pelan supaya hero terasa hidup. */
function FloatingBadge({ name, background, color, style, delay = 0, label }) {
  return (
    <motion.span
      className="absolute grid place-items-center rounded-full"
      style={{ width: 42, height: 42, background, color, boxShadow: shadow.soft, ...style }}
      animate={motionSpec.float.animate}
      transition={{ ...motionSpec.float.transition, delay }}
      role="img"
      aria-label={label}
    >
      <Icon name={name} size={19} />
    </motion.span>
  );
}

/** Satu baris statistik inline dengan ikon kecil di kiri teks. */
function InlineStat({ icon, label, value, valueColor = colors.textDark }) {
  return (
    <div className="flex items-center gap-2.5 min-w-0">
      <span
        className="grid place-items-center rounded-full shrink-0"
        style={{ width: 34, height: 34, background: colors.white, color: colors.tealDeep, boxShadow: shadow.soft }}
      >
        <Icon name={icon} size={17} />
      </span>
      <span className="min-w-0">
        <span className="block font-medium truncate" style={{ color: colors.textMuted, fontSize: 11.5 }}>{label}</span>
        <span className="block font-extrabold truncate" style={{ color: valueColor, fontSize: 14 }}>{value}</span>
      </span>
    </div>
  );
}

function HomeScreen({ player, onTogglePlay, onSeek, onLearnMore, notif, onNotif }) {
  const { lesson, elapsed, duration, playing } = player;
  const progress = duration ? elapsed / duration : 0;

  return (
    <motion.div
      initial="hidden"
      animate="show"
      variants={{ show: { transition: { staggerChildren: motionSpec.stagger.delayStep } } }}
      className="flex flex-col min-h-full flex-1"
      style={{ background: colors.cream }}
    >
      {/* Header solid-color. */}
      <div
        style={{
          background: `linear-gradient(160deg, ${colors.coralFrom} 0%, ${colors.coralTo} 100%)`,
          padding: `20px ${layout.paddingX}px ${layout.sheetOverlap + 26}px`,
        }}
      >
        <GreetingHeader
          name="Elizabeth"
          date="Mon, 23 July"
          tone="light"
          toggleOn={notif}
          onToggle={onNotif}
        />

        {/* Pil gelap melayang di bawah header. */}
        <motion.button
          type="button"
          variants={motionSpec.fadeUp}
          custom={1}
          whileTap={motionSpec.press}
          onClick={onLearnMore}
          className="mt-6 flex items-center gap-2.5 rounded-full font-bold"
          style={{
            background: colors.textDark, color: colors.textWhite,
            padding: "13px 22px", fontSize: 13.5, boxShadow: shadow.lifted,
          }}
        >
          <span className="grid place-items-center rounded-full" style={{ width: 22, height: 22, background: colors.coralDecor }}>
            <Icon name="Sparkles" size={13} />
          </span>
          Request Demo
        </motion.button>
      </div>

      {/* Panel konten yang menindih header. */}
      <DockedSheet>
        <SectionHead onLearnMore={onLearnMore}>
          <span className="font-semibold" style={{ color: colors.textMuted, fontSize: 11.5 }}>Level 22</span>
          <h2 className="font-extrabold leading-tight" style={{ color: colors.textDark, fontSize: 23, marginTop: 2 }}>
            Learning progress
          </h2>
        </SectionHead>

        {/* Dua statistik inline. "Active" adalah bukti sesi masih hidup. */}
        <motion.div variants={motionSpec.fadeUp} custom={2} className="grid grid-cols-2 gap-3 mt-5">
          <InlineStat
            icon="Activity"
            label="Current activity"
            value={playing ? "Active" : "Paused"}
            valueColor={playing ? colors.tealDeep : colors.textMuted}
          />
          <InlineStat icon="BookOpen" label="Lessons" value="#44" />
        </motion.div>

        {/* Hero: lingkaran teal + cincin progres + badge mengambang. */}
        <motion.div variants={motionSpec.fadeUp} custom={3} className="relative grid place-items-center mt-7">
          <div className="relative" style={{ width: 188, height: 188 }}>
            <ProgressRing progress={progress} />
            <div
              className="absolute grid place-items-center rounded-full overflow-hidden"
              style={{ inset: 18, background: colors.tealDeep, color: colors.tealSoft }}
              role="img"
              aria-label={`Thumbnail kursus ${lesson.title}`}
            >
              <Icon name="GraduationCap" size={54} strokeWidth={1.4} />
            </div>
            <FloatingBadge
              name="Star" label="Ditandai favorit"
              background={colors.orangeAccent} color={colors.textDark}
              style={{ right: -8, top: 24 }}
            />
            <FloatingBadge
              name="Bookmark" label="Disimpan"
              background={colors.white} color={colors.coralTo}
              style={{ left: -6, bottom: 34 }} delay={0.9}
            />
          </div>

          <p className="font-bold mt-4 text-center" style={{ color: colors.textDark, fontSize: 14 }}>
            {lesson.title}
          </p>
          <p className="font-medium text-center" style={{ color: colors.textMuted, fontSize: 11.5 }}>
            {lesson.chapter}
          </p>
        </motion.div>

        {/* Scrubber. */}
        <motion.div variants={motionSpec.fadeUp} custom={4} className="mt-5">
          <label className="sr-only" htmlFor="scrub">Posisi pemutaran</label>
          <input
            id="scrub"
            type="range"
            min={0}
            max={duration}
            value={Math.round(elapsed)}
            onChange={(e) => onSeek(Number(e.target.value))}
            className="w-full appearance-none bg-transparent cursor-pointer"
            style={{ height: 22 }}
            aria-valuetext={`${formatTime(elapsed)} dari ${formatTime(duration)}`}
          />
          <div className="flex justify-between font-bold tabular-nums" style={{ color: colors.textDark, fontSize: 12.5 }}>
            <span>{formatTime(elapsed)}</span>
            <span style={{ color: colors.textMuted }}>{formatTime(duration)}</span>
          </div>
        </motion.div>

        {/* Control bar. */}
        <motion.div variants={motionSpec.fadeUp} custom={5} className="flex items-center justify-center gap-7 mt-4 mb-1">
          <IconButton
            label="Atur volume" name="Volume2"
            className="shrink-0"

const STATS = [

];

/** Titik data bulanan. Angka realistis, bukan placeholder acak. */
const SERIES = [
  { month: "May", value: 41, delta: null },
  { month: "Jun", value: 53, delta: +12 },
  { month: "July", value: 46, delta: null },
  { month: "August", value: 78, delta: +43, peak: true },
  { month: "Sept", value: 56, delta: -22 },
];

/**
 * Line chart.
 *
 * Path digambar progresif lewat stroke-dasharray, lalu tooltip puncak
 * muncul setelah garisnya selesai — urutannya menyampaikan "progres tercapai",
 * bukan sekadar elemen yang muncul bersamaan.
 */
function ProgressChart({ data, height = 150 }) {
  const W = 320, padX = 14, padTop = 34, padBottom = 30;

  const { titik, garis, area, puncak } = useMemo(() => {
    const max = Math.max(...data.map(d => d.value)) * 1.12;
    const stepX = (W - padX * 2) / (data.length - 1);
    const titik = data.map((d, i) => ({
      ...d,
      x: padX + i * stepX,
      y: padTop + (1 - d.value / max) * (height - padTop - padBottom),
    }));
    // Catmull-Rom → kubik Bezier supaya lengkungnya halus tanpa melewati titik.
    const garis = titik.map((p, i) => {
      if (i === 0) return `M ${p.x} ${p.y}`;
      const p0 = titik[i - 2] || titik[i - 1], p1 = titik[i - 1], p3 = titik[i + 1] || p;
      const t = 0.2;
      return `C ${(p1.x + (p.x - p0.x) * t).toFixed(1)} ${(p1.y + (p.y - p0.y) * t).toFixed(1)}, ` +
             `${(p.x - (p3.x - p1.x) * t).toFixed(1)} ${(p.y - (p3.y - p1.y) * t).toFixed(1)}, ` +
             `${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
    }).join(" ");
    const area = `${garis} L ${titik.at(-1).x} ${height - padBottom} L ${titik[0].x} ${height - padBottom} Z`;
    return { titik, garis, area, puncak: titik.find(p => p.peak) || titik[0] };
  }, [data, height]);

  const persen = (n, total) => `${(n / total * 100).toFixed(2)}%`;

  return (
    <div className="w-full" style={{ marginTop: 4 }}>
      {/* Kotak ini HANYA membungkus SVG.
          Tooltip dan chip diposisikan dengan persentase terhadap viewBox, jadi
          kotak acuannya harus berukuran sama persis dengan SVG. Kalau baris
          label bulan ikut masuk ke sini, acuan tingginya jadi lebih besar dan
          semua overlay meleset ke bawah. */}
      <div className="relative w-full">
      <svg viewBox={`0 0 ${W} ${height}`} className="w-full block" style={{ overflow: "visible" }} aria-hidden="true">
        <defs>
          <linearGradient id="planFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={colors.chartFill} stopOpacity="0.20" />
            <stop offset="100%" stopColor={colors.chartFill} stopOpacity="0" />
          </linearGradient>
        </defs>
        <motion.path
          d={area} fill="url(#planFill)"
          initial={{ opacity: 0 }} animate={{ opacity: 1 }}
          transition={{ duration: 0.5, delay: 0.55 }}
        />
        <motion.path
          d={garis} fill="none" stroke={colors.chartLine} strokeWidth={3}
          strokeLinecap="round" strokeLinejoin="round"
          initial={{ pathLength: 0 }} animate={{ pathLength: 1 }}
          transition={motionSpec.chartDraw}
        />
        <motion.circle
          cx={puncak.x} cy={puncak.y} r={5}
          fill={colors.chartLine} stroke={colors.cream} strokeWidth={3}
          initial={{ scale: 0 }} animate={{ scale: 1 }}
          transition={{ type: "spring", stiffness: 420, damping: 14, delay: 0.9 }}
          style={{ transformOrigin: `${puncak.x}px ${puncak.y}px` }}
        />
      </svg>

      {/* Tooltip pill di titik puncak.
          Pemosisian dan animasi sengaja dipisah ke dua elemen. Framer Motion
          menulis properti `transform` sendiri saat menganimasikan scale/y,
          sehingga translate(-50%,…) untuk memusatkan elemen akan tertimpa
          kalau ditaruh di elemen yang sama. */}
      <div
        className="absolute"
        style={{ left: persen(puncak.x, W), top: persen(puncak.y, height), transform: "translate(-50%,-100%)" }}
      >
        <motion.div
          className="relative font-extrabold tabular-nums"
          style={{
            background: colors.textDark, color: colors.textWhite,
            borderRadius: radius.pill, padding: "6px 13px", fontSize: 12.5,
            whiteSpace: "nowrap", marginBottom: 12,
          }}
          initial={{ opacity: 0, scale: 0.5, y: 6 }}
          animate={{ opacity: 1, scale: 1, y: 0 }}
          transition={motionSpec.tooltipPop}
        >
          {puncak.value}%
          <span
            className="absolute left-1/2 rotate-45"
            style={{ width: 9, height: 9, background: colors.textDark, bottom: -4, marginLeft: -4.5 }}
            aria-hidden="true"
          />
        </motion.div>
      </div>

      {/* Label delta kecil, pola pemisahan yang sama. */}
      {titik.filter(p => p.delta !== null && !p.peak).map(p => (
        <div
          key={p.month}
          className="absolute"
          style={{ left: persen(p.x, W), top: persen(p.y, height), transform: "translate(-50%,-100%)" }}
        >
          <motion.span
            className="block font-bold tabular-nums"
            style={{
              background: p.delta > 0 ? colors.tealSoft : colors.pinkAccent,
              color: p.delta > 0 ? colors.tealDeep : "#8A2338",
              borderRadius: radius.pill, padding: "3px 9px", fontSize: 10.5,
              whiteSpace: "nowrap", marginBottom: 10,
            }}
            initial={{ opacity: 0, y: 4 }} animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.3, delay: 1.05 }}
          >
            {p.delta > 0 ? "+" : ""}{p.delta}
          </motion.span>
        </div>
      ))}
      </div>

      <div className="grid mt-1" style={{ gridTemplateColumns: `repeat(${data.length}, 1fr)` }}>
        {data.map(d => (
          <span key={d.month} className="text-center font-semibold" style={{ color: colors.textMuted, fontSize: 11 }}>
            {d.month}
          </span>
        ))}
      </div>
    </div>
  );
}

                type="button"
                onClick={() => setTab(t.id)}
                whileTap={motionSpec.press}
                aria-current={aktif ? "page" : undefined}
                className="relative flex-1 grid place-items-center gap-0.5 rounded-full"
                style={{ padding: "9px 4px", color: aktif ? colors.tealDeep : colors.textOnTealMuted }}
              >
                {aktif && (
                  <motion.span
                    layoutId="tab-aktif"
                    transition={motionSpec.segment}
                    className="absolute inset-0 rounded-full"
                    style={{ background: colors.white }}
                  />
                )}
                <span className="relative z-10 grid place-items-center gap-0.5">
                  <Icon name={t.icon} size={18} />
                  <span className="font-bold" style={{ fontSize: 10 }}>{t.label}</span>
                </span>
              </motion.button>
            );
          })}
        </nav>
      </div>
    </div>
  );
}

/* Scrubber mengecat isian track lewat custom property. */
function SinkronScrubber() {
  React.useEffect(() => {
    const perbarui = () => document.querySelectorAll('input[type=range]').forEach(el => {
      const p = ((el.value - el.min) / (el.max - el.min)) * 100;
      el.style.setProperty('--p', p + '%');
    });
    perbarui();
    const id = setInterval(perbarui, 200);
    document.addEventListener('input', perbarui);
    return () => { clearInterval(id); document.removeEventListener('input', perbarui); };
  }, []);
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(React.Fragment, null,
    React.createElement(SinkronScrubber),
    React.createElement(App)
  )
);
</script>
